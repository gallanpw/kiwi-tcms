# /etc/nginx/sites-available/kiwi  (lalu symlink ke sites-enabled)
# Ganti server_name dan path sertifikat sesuai kondisi:
#   - IP saja: sertifikat self-signed (lihat README.md)
#   - Domain : sertifikat Let's Encrypt (certbot --nginx mengisi path-nya)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/kiwi/kiwi.crt;
    ssl_certificate_key /etc/ssl/kiwi/kiwi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /static/ {
        alias /var/www/kiwi/static/;
        expires 7d;
    }

    location /uploads/ {
        alias /var/www/kiwi/uploads/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
