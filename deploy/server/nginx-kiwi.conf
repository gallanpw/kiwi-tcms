# /etc/nginx/sites-available/kiwi  (lalu symlink ke sites-enabled)
# Ganti server_name dan path sertifikat sesuai kondisi:
#   - IP saja: sertifikat self-signed (lihat README.md)
#   - Domain : sertifikat Let's Encrypt (certbot --nginx mengisi path-nya)

# Letakkan di blok http (mis. /etc/nginx/conf.d/mcp-limit.conf), di luar server {}:
#   limit_req_zone $binary_remote_addr zone=mcp:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/kiwi/kiwi.crt;
    ssl_certificate_key /etc/ssl/kiwi/kiwi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /static/ {
        alias /var/www/kiwi/static/;
        expires 7d;
    }

    location /uploads/ {
        alias /var/www/kiwi/uploads/;
    }

    # Kaspin Kiwi MCP (service kiwi-mcp, port 8765). Posisinya bebas: nginx memilih
    # location berawalan terpanjang, jadi /mcp selalu menang atas `location /`.
    location /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # respons streaming
        proxy_read_timeout 120s;
        client_max_body_size 6m;      # file upload maksimal 5 MB
        # Endpoint ini menerima password Kiwi lewat header, jadi batasi percobaan per IP.
        limit_req zone=mcp burst=20 nodelay;
        # Jangan catat header (berisi password/token): access_log default hanya baris permintaan.
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
