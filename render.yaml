services:
  - type: web
    name: kiwi-tcms
    runtime: docker
    plan: free # 512 MB RAM, sleeps after 15 min idle, no persistent disk
    region: singapore # keep close to the Neon region (aws-ap-southeast-1)
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: ./deploy
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: SECRET_KEY
        generateValue: true
      # Neon (use the DIRECT host, not the "-pooler" one)
      - key: KIWI_DB_ENGINE
        value: django.db.backends.postgresql
      - key: PGSSLMODE
        value: require
      - key: KIWI_DB_HOST
        sync: false
      - key: KIWI_DB_PORT
        value: "5432"
      - key: KIWI_DB_NAME
        sync: false
      - key: KIWI_DB_USER
        sync: false
      - key: KIWI_DB_PASSWORD
        sync: false
      # first admin; remove DJANGO_SUPERUSER_PASSWORD after the first deploy
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
