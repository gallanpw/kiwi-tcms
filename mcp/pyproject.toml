[project]
name = "kaspin-kiwi-mcp"
version = "0.1.0"
description = "MCP server 'kaspin kiwi': backup Zebrunner test cases and import them (or CSV/XLSX/JSON files) into Kiwi TCMS."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",  # 2.x renamed FastMCP to MCPServer; migrate deliberately
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
kaspin-kiwi-mcp = "kaspin_kiwi_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaspin_kiwi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
